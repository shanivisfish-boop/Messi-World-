<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messi World ⚽</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #061b3a, #0b5fa5, #79d7ff);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 30px 15px;
  background: rgba(0,0,0,0.25);
}

h1 {
  font-size: 38px;
  margin: 5px;
}

.subtitle {
  font-size: 18px;
  opacity: 0.9;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 25px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

button {
  width: 100%;
  border: none;
  border-radius: 18px;
  padding: 15px;
  margin: 8px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #07529a;
}

button:hover {
  transform: scale(1.02);
}

.question {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.score {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
}

.back {
  display: block;
  text-align: center;
  text-decoration: none;
  color: white;
  font-weight: bold;
  margin: 20px;
}

#result {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Messi World</h1>
  <div class="subtitle">🎮 עולם המשחקים של מסי</div
